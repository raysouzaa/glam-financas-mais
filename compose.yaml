services:
  app:
    build: {context: ., dockerfile: docker/Dockerfile}
    env_file: .env
    ports: ["8088:80"]
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["php", "artisan", "queue:work", "--sleep=2", "--tries=3"]
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  scheduler:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-financaplus}
      POSTGRES_USER: ${DB_USERNAME:-financaplus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"], interval: 5s, timeout: 5s, retries: 15}
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:8025:8025"]
    restart: unless-stopped
volumes: {pgdata: {}}
